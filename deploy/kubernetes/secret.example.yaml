apiVersion: v1
kind: Secret
metadata:
  name: bot-secrets
  namespace: universal-discord-bot
type: Opaque
stringData:
  # Must use the same password as DATABASE_URL. Host is the in-cluster Service name.
  POSTGRES_PASSWORD: change-me
  DATABASE_URL: postgresql+asyncpg://bot:change-me@postgres:5432/bot
  DISCORD_TOKEN: ""
  DISCORD_CLIENT_SECRET: ""
  SESSION_SECRET: change-me-long-random
  TWITCH_CLIENT_SECRET: ""
  TWITCH_EVENTSUB_SECRET: change-me-long-random
