apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: universal-discord-bot
spec:
  ingressClassName: nginx
  # tls:
  #   - hosts:
  #       - bot.example.com
  #     secretName: bot-tls
  rules:
    - host: bot.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
          - path: /twitch
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
