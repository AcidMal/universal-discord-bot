apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: universal-discord-bot
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: universal-discord-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: api
          image: ghcr.io/acidmal/universal-discord-bot-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: bot-secrets
                  key: DATABASE_URL
            - name: DISCORD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bot-secrets
                  key: DISCORD_TOKEN
            - name: DISCORD_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: bot-secrets
                  key: DISCORD_CLIENT_SECRET
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: bot-secrets
                  key: SESSION_SECRET
            - name: TWITCH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: bot-secrets
                  key: TWITCH_CLIENT_SECRET
            - name: TWITCH_EVENTSUB_SECRET
              valueFrom:
                secretKeyRef:
                  name: bot-secrets
                  key: TWITCH_EVENTSUB_SECRET
            - name: PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: bot-config
                  key: PUBLIC_URL
            - name: DISCORD_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: bot-config
                  key: DISCORD_CLIENT_ID
            - name: BOT_ADMIN_IDS
              valueFrom:
                configMapKeyRef:
                  name: bot-config
                  key: BOT_ADMIN_IDS
            - name: SHARD_COUNT
              valueFrom:
                configMapKeyRef:
                  name: bot-config
                  key: SHARD_COUNT
            - name: TWITCH_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: bot-config
                  key: TWITCH_CLIENT_ID
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
