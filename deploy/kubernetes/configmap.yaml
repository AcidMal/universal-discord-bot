apiVersion: v1
kind: ConfigMap
metadata:
  name: bot-config
  namespace: universal-discord-bot
data:
  # Public dashboard origin, no trailing slash. Must match the Ingress host.
  PUBLIC_URL: "https://bot.example.com"
  DISCORD_CLIENT_ID: ""
  BOT_ADMIN_IDS: ""
  # 0 asks Discord for the recommended shard count.
  SHARD_COUNT: "0"
  TWITCH_CLIENT_ID: ""
