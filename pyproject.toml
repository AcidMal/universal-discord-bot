[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-discord-bot"
version = "0.1.0"
description = "Multi-tenant Discord moderation bot with a themable dashboard"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.4,<3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "greenlet>=3.0",
]

[tool.setuptools.packages.find]
include = ["bot*", "api*", "shared*"]

[tool.setuptools.package-data]
shared = ["py.typed"]
